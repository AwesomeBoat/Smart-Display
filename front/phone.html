<!DOCTYPE html>
<html lang="fr" data-theme="glacier">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Display · Télécommande</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap">

    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/phone.css">
</head>
<body>
    <div class="sd-phone">
        <!-- errors from the API, in words -->
        <p id="message" class="sd-error t-phone-small" role="alert"></p>

        <!-- ===== Profile card ===== -->
        <section class="sd-glass">
            <div class="sd-profile-row">
                <span id="profileAvatar" class="sd-avatar" aria-hidden="true"></span>
                <select id="profileSelect" class="sd-select" aria-label="Profil"></select>
            </div>

            <p id="displayStatus" class="sd-status t-phone-small sd-muted"></p>

            <!-- how the display looks when this profile is shown -->
            <div class="sd-settings-row">
                <select id="modeSelect" class="sd-select" aria-label="Affichage">
                    <option value="jour">Jour</option>
                    <option value="semaine">Semaine</option>
                </select>
                <select id="themeSelect" class="sd-select" aria-label="Thème">
                    <option value="glacier">Glacier</option>
                    <option value="braise">Braise</option>
                    <option value="ivoire">Ivoire</option>
                </select>
            </div>

            <div class="sd-actions">
                <button id="showOnDisplayBtn" class="sd-btn sd-btn--primary" type="button">
                    <svg class="sd-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                    Afficher sur l'écran
                </button>
                <button id="deleteProfileBtn" class="sd-btn sd-btn--ghost sd-btn--danger" type="button">
                    <svg class="sd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>
                    Supprimer ce profil
                </button>
            </div>
        </section>

        <details id="profileDetails" class="sd-disclosure">
            <summary class="t-phone-body">Nouveau profil</summary>
            <form id="profileForm" class="sd-form sd-form--stack">
                <input class="sd-input" type="text" name="name" placeholder="Nom" required>
                <input class="sd-input" type="url" name="ical_url" placeholder="URL iCal (optionnel)">
                <button class="sd-btn sd-btn--primary" type="submit">Créer</button>
            </form>
        </details>

        <!-- ===== Tasks ===== -->
        <h2 class="t-phone-title">Tâches <span id="taskCount" class="t-phone-small sd-muted sd-num"></span></h2>
        <form id="taskForm" class="sd-form">
            <input id="taskInput" class="sd-input" type="text" name="task" placeholder="Nouvelle tâche" required>
            <button class="sd-btn sd-btn--icon sd-btn--primary" type="submit" aria-label="Ajouter la tâche">
                <svg class="sd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </form>
        <ul id="taskList" class="sd-list sd-plist"></ul>

        <!-- ===== Habits ===== -->
        <h2 class="t-phone-title">Habitudes</h2>
        <form id="habitForm" class="sd-form">
            <input id="habitInput" class="sd-input" type="text" name="name" placeholder="Nouvelle habitude" required>
            <button class="sd-btn sd-btn--icon sd-btn--primary" type="submit" aria-label="Ajouter l'habitude">
                <svg class="sd-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </form>
        <ul id="habitList" class="sd-list sd-plist"></ul>
    </div>

    <script type="module" src="/static/js/phone.js"></script>
</body>
</html>
